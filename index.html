<!DOCTYPE html>
<html translate="no" lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El pollo loco</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="shortcut icon"
      href="img/10_other/el_pollo_loco_favicon.png"
      type="image/x-icon"
    />
  </head>

  <body onload="init()">
    <h1>El pollo loco</h1>
    <div id="game-container" class="game-container">
      <canvas id="canvas" width="720" height="480" class="screen"></canvas>

      <div id="overlay-start" class="overlay start d-none screen">
        <!-- <h>Help Pepe</h> -->
        <button class="init-btn" onclick="startTheGame()">Start</button>
      </div>
      <div id="overlay-game-over" class="overlay game-over d-none screen">
        <button class="init-btn" onclick="restartTheGame()">Try Again</button>
        <button class="init-btn" onclick="backToStart()">Back to Menu</button>
      </div>
      <div id="overlay-win" class="overlay win d-none screen">
        <button class="init-btn" onclick="restartTheGame()">New Game</button>
        <button class="init-btn" onclick="backToStart()">Back to Menu</button>
      </div>
      <div
        id="overlay-game-restart"
        class="overlay restart d-none screen direktion-column"
      >
        <button class="init-btn" onclick="restartTheGame()">Try Again</button>
        <button class="init-btn" onclick="backToStart()">Back to Menu</button>
      </div>
      <div
        id="info-overlay"
        class="overlay info d-none screen direktion-column"
      >
        <button class="init-btn" onclick="">Privacy Policy</button>
        <button class="init-btn" onclick="">Legal Notice</button>
      </div>
      <div id="controls-menu" class="controls overlay d-none screen">
        <div class="explain-btn">
          <img
            src="/img/explanation/walk.png"
            alt=""
            class="game-instructions"
          />
          <div>
            Press
            <span>LEFT</span>
            or
            <span>RIGHT</span>
            arrow key to
            <span>move</span>
            in this direction
          </div>
        </div>
        <div class="explain-btn">
          <img
            src="/img/explanation/on-jump.png"
            alt=""
            class="game-instructions"
          />
          <div>
            Press
            <span>SPACE</span>
            to
            <span>jump</span>
          </div>
        </div>
        <div class="explain-btn">
          <img
            src="/img/explanation/throw.png"
            alt=""
            class="game-instructions"
          />
          <div>
            Press
            <span>D</span>
            to
            <span>throw</span>
            a bottle
          </div>
        </div>
      </div>
      <button
        type="button"
        class="main-btn fullscreen-btn"
        onclick="fullscreenView();this.blur()"
      >
        <img
          src="img/10_other/fullscreen_white.png"
          alt="fullscreen einschalten"
        />
      </button>
      <button
        type="button"
        id="mute-btn"
        class="main-btn mute-btn"
        onclick="muteBtn();this.blur()"
      >
        <img src="img/10_other/sounds.png" alt="Sound control" />
      </button>
      <button
        type="button"
        class="main-btn control-menu-btn"
        id="control-menu-btn"
        onclick="toggleOverlay(`controls-menu`,`control-menu-btn`);this.blur()"
      >
        <img src="img/10_other/control.png" alt="" />
      </button>
      <button
        type="button"
        class="main-btn restart-btn"
        id="restart-btn"
        onclick="toggleOverlay(`overlay-game-restart`,`restart-btn`);this.blur()"
      >
        <img src="img/10_other/restart.png" alt="" />
      </button>
      <button
        type="button"
        class="main-btn info-btn"
        id="info-btn"
        onclick="toggleOverlay(`info-overlay`,`info-btn`);this.blur()"
      >
        <img src="img/10_other/info.png" alt="" />
      </button>
    </div>

    <script src="/models/drawable-object.class.js"></script>

    <script src="/models/status-bar.class.js"></script>
    <script src="/models/collectibles.class.js"></script>
    <script src="/models/world.class.js"></script>
    <script src="/models/movable-object.class.js"></script>
    <script src="/models/throwable-object.class.js"></script>
    <script src="/models/background-object.class.js"></script>
    <script src="/models/character.class.js"></script>
    <script src="/models/chicken.class.js"></script>
    <script src="/models/smallChicken.class.js"></script>
    <script src="/models/endboss.class.js"></script>
    <script src="/models/cloud.class.js"></script>
    <script src="/models/keyboard.class.js"></script>
    <script src="/models/level.class.js"></script>

    <script src="/levels/level1.js"></script>
    <script src="/js/game.js"></script>
  </body>
</html>
